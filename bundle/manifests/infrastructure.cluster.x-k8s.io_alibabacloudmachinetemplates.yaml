                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      dataDisks:
                        description: DataDisks describes additional data disks.
                        items:
                          description: DataDisk describes an additional data disk
                            for an ECS instance.
                          properties:
                            category:
                              description: Category is the disk category.
                              enum:
                              - cloud_efficiency
                              - cloud_ssd
                              - cloud_essd
                              - cloud_auto
                              type: string
                            encrypted:
                              description: Encrypted enables server-side encryption
                                of the disk.
                              type: boolean
