                          category:
                            description: Category is the disk category (e.g. cloud_efficiency,
                              cloud_ssd, cloud_essd).
                            enum:
                            - cloud_efficiency
                            - cloud_ssd
                            - cloud_essd
                            - cloud_auto
                            type: string
                          encrypted:
                            description: Encrypted enables server-side encryption
                              of the disk.
                            type: boolean
                          kmsKeyID:
                            description: |-
                              KMSKeyID is the ID of the KMS key used to encrypt the disk. When Encrypted
                              is true and KMSKeyID is empty, Alibaba Cloud's default EBS service key is
                              used. Setting KMSKeyID without Encrypted=true is rejected by the webhook.
                            type: string
                          performanceLevel:
                            description: |-
                              PerformanceLevel is the ESSD performance level. Only meaningful for the
                              cloud_essd category; ignored otherwise.
                            enum:
                            - PL0
                            - PL1
                            - PL2
                            - PL3
                            type: string
                          size:
                            description: Size is the disk size in GiB.
                            minimum: 20
                            type: integer
                        required:
                        - category
                        - size
                        type: object
                      tags:
                        description: Tags are additional tags to apply to the ECS
                          instance.
                        items:
                          description: Tag is a key-value pair applied to an Alibaba
                            Cloud resource.
                          properties:
                            key:
                              description: Key is the tag key.
                              minLength: 1
                              type: string
                            value:
                              description: Value is the tag value.
                              type: string
                          required:
                          - key
                          - value
                          type: object
                        type: array
                      userDataSecret:
                        description: |-
                          UserDataSecret refers to a Secret containing the base64-encoded user data
                          script to execute on instance startup.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
