            properties:
              template:
                description: AlibabaCloudMachineTemplateResource describes the data
                  needed to create an AlibabaCloudMachine from a template.
                properties:
                  spec:
                    description: AlibabaCloudMachineSpec defines the desired state
                      of AlibabaCloudMachine.
                    properties:
                      credentialsSecret:
                        description: |-
                          CredentialsSecret refers to a Secret containing Alibaba Cloud credentials.
                          If not specified, the controller uses the ambient credentials from the
                          cluster credential infrastructure.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
