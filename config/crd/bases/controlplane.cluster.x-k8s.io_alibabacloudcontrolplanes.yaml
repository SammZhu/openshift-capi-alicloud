---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1beta1
  name: alibabacloudcontrolplanes.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: AlibabaCloudControlPlane
    listKind: AlibabaCloudControlPlaneList
    plural: alibabacloudcontrolplanes
    singular: alibabacloudcontrolplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.initialization.controlPlaneInitialized
      name: Initialized
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AlibabaCloudControlPlane represents a Kubernetes control plane for use as a
          Cluster's spec.controlPlaneRef. Today it only models an EXTERNALLY-managed
          control plane (mode=external): the control plane already exists out-of-band, so
          this object simply reports it as initialized + externally-managed so CAPI core
          will drive worker MachineDeployments under the same Cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlibabaCloudControlPlaneSpec defines the desired state of
              AlibabaCloudControlPlane.
            properties:
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint is the endpoint used to reach the API server. For an
                  externally-managed control plane this is the existing cluster's internal
                  API endpoint (api-int). When set it is surfaced on Cluster.spec.controlPlaneEndpoint.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              mode:
                default: external
                description: |-
                  Mode declares how the control plane is managed. "external" (the default)
                  adopts a control plane that already exists and is managed outside Cluster
                  API.
                enum:
                - external
                type: string
              version:
                description: |-
                  Version is the Kubernetes version of the control plane. Required by the
                  Cluster API control-plane contract; it should match the version the
                  external control plane actually serves (e.g. v1.33.0).
                minLength: 1
                type: string
            required:
            - version
            type: object
          status:
            description: AlibabaCloudControlPlaneStatus defines the observed state
              of AlibabaCloudControlPlane.
            properties:
              conditions:
                description: Conditions defines current service state of the AlibabaCloudControlPlane.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              externalManagedControlPlane:
                description: |-
                  ExternalManagedControlPlane signals the control plane is externally managed
                  (Cluster API contract): control-plane Node objects are not managed by CAPI.
                  Set true so CAPI core skips control-plane-node bookkeeping (the AKS/EKS/GKE
                  pattern; see util.IsExternalManagedControlPlane).
                type: boolean
              initialization:
                description: Initialization provides the control-plane contract's
                  initialized signal.
                properties:
                  controlPlaneInitialized:
                    description: |-
                      ControlPlaneInitialized is true once the Kubernetes control plane can
                      accept requests. CAPI core bubbles this up to Cluster's
                      status.initialization.controlPlaneInitialized + the ControlPlaneInitialized
                      condition, which in turn gates worker Machine node-health (and therefore
                      MachineDeployment readiness).
                    type: boolean
                type: object
              ready:
                default: false
                description: Ready denotes that the control plane is ready.
                type: boolean
              version:
                description: Version is the observed Kubernetes version of the control
                  plane.
                type: string
            required:
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
