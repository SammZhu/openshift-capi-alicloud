---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: alibabacloudclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: AlibabaCloudCluster
    listKind: AlibabaCloudClusterList
    plural: alibabacloudclusters
    singular: alibabacloudcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: AlibabaCloudCluster is the Schema for the alibabacloudclusters
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlibabaCloudClusterSpec defines the desired state of AlibabaCloudCluster.
            properties:
              additionalTags:
                description: |-
                  AdditionalTags are additional tags to apply to all cloud resources created
                  for this cluster.
                items:
                  description: Tag is a key-value pair applied to an Alibaba Cloud
                    resource.
                  properties:
                    key:
                      description: Key is the tag key.
                      minLength: 1
                      type: string
                    value:
                      description: Value is the tag value.
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
              bootImageID:
                description: |-
                  BootImageID is the Alibaba Cloud custom image used to boot worker nodes so
                  they join THIS cluster. It is the imported OpenShift discovery/RHCOS image
                  (the same ecs_image_id used to install the cluster, or a day-2 add-hosts
                  infra-env image) and carries the embedded Ignition / infra-env config.
                  AlibabaCloudMachines that omit spec.imageID fall back to this value, so a
                  MachineDeployment template does not have to repeat it. Leaving both empty
                  makes machine provisioning fail with a terminal NoBootImage error.
                type: string
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint represents the endpoint used to communicate with the
                  control plane. Populated by the controller once a SLB is provisioned.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              failureDomains:
                description: |-
                  FailureDomains lists the availability zones available for worker node
                  placement. Each entry pairs a zone ID with the VSwitch to use in that zone.
                  When set, CAPI automatically distributes Machines across zones using
                  round-robin assignment via Machine.Spec.FailureDomain.
                  Leave ZoneID/VSwitchID in AlibabaCloudMachineTemplate empty to allow
                  this automatic placement; explicit values in the template take precedence.
                items:
                  description: |-
                    FailureDomain maps an Alibaba Cloud availability zone to the VSwitch that
                    should be used for ECS instances placed in that zone.
                    When AlibabaCloudCluster.Spec.FailureDomains is populated, CAPI will
                    automatically distribute Machines across the listed zones.
                  properties:
                    vSwitchID:
                      description: VSwitchID is the ID of the VSwitch to use for instances
                        in this zone.
                      type: string
                    zoneID:
                      description: ZoneID is the Alibaba Cloud availability zone identifier
                        (e.g. cn-hangzhou-h).
                      type: string
                  required:
                  - vSwitchID
                  - zoneID
                  type: object
                type: array
              ignitionStorage:
                description: |-
                  IgnitionStorage configures an OSS bucket used to offload worker Ignition
                  (ECS user-data) that exceeds the RunInstances UserData size limit. When the
                  rendered Ignition is too large, the controller uploads it to OSS and passes
                  the instance a tiny pointer Ignition that fetches the full config from a
                  presigned URL. Leave nil to disable offload (oversized user-data then fails
                  provisioning with a terminal UserDataTooLarge error).
                properties:
                  expirySeconds:
                    description: |-
                      ExpirySeconds is how long the presigned fetch URL stays valid. The node
                      fetches Ignition once at first boot, so this only needs to outlast
                      provisioning. Defaults to 3600 (1h).
                    minimum: 60
                    type: integer
                  maxUserDataBytes:
                    description: |-
                      MaxUserDataBytes is the size threshold (measured on the base64 user-data)
                      above which offload kicks in. Defaults to 16384, the ECS UserData limit.
                    minimum: 1024
                    type: integer
                  ossBucket:
                    description: |-
                      OSSBucket is the bucket that holds offloaded Ignition objects. Required to
                      enable offload.
                    type: string
                  ossEndpoint:
                    description: |-
                      OSSEndpoint overrides the OSS endpoint. Defaults to the region's internal
                      endpoint (oss-<region>-internal.aliyuncs.com), reachable from within the
                      VPC without internet egress — keeping Ignition fetch on the private network.
                    type: string
                required:
                - ossBucket
                type: object
              region:
                description: Region is the Alibaba Cloud region where the cluster
                  is deployed.
                type: string
              resourceGroupID:
                description: ResourceGroupID is the ID of the resource group for all
                  cluster resources.
                type: string
              vpcID:
                description: |-
                  VpcID is the ID of an existing VPC to use for the cluster. If empty, a VPC
                  will be created.
                type: string
            required:
            - region
            type: object
          status:
            description: AlibabaCloudClusterStatus defines the observed state of AlibabaCloudCluster.
            properties:
              conditions:
                description: Conditions defines current service state of the AlibabaCloudCluster.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint is the endpoint downstream consumers (Machine
                  controller, control-plane provider) use to reach the API server.
                  In BYO mode it mirrors Spec.ControlPlaneEndpoint; the CAPI infra-cluster
                  contract requires this to be populated before status.ready=true.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              failureDomains:
                description: |-
                  FailureDomains is the list of failure domains published to CAPI so it can
                  automatically spread Machines across availability zones.
                  Populated by the controller from Spec.FailureDomains.
                items:
                  description: |-
                    FailureDomain is the Schema for Cluster API failure domains.
                    It allows controllers to understand how many failure domains a cluster can optionally span across.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: attributes is a free form map of attributes an
                        infrastructure provider might use or require.
                      type: object
                    controlPlane:
                      description: controlPlane determines if this failure domain
                        is suitable for use by control plane machines.
                      type: boolean
                    name:
                      description: name is the name of the failure domain.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              ready:
                default: false
                description: Ready indicates that the cluster infrastructure is ready.
                type: boolean
              slbInstanceID:
                description: |-
                  SLBInstanceID is the ID of the Server Load Balancer created for the
                  control plane endpoint.
                type: string
              vpcID:
                description: VpcID is the ID of the VPC created or adopted for the
                  cluster.
                type: string
            required:
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
