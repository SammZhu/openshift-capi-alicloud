---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: alibabacloudmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: AlibabaCloudMachine
    listKind: AlibabaCloudMachineList
    plural: alibabacloudmachines
    singular: alibabacloudmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - jsonPath: .status.instanceState
      name: State
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .status.instanceID
      name: InstanceID
      type: string
    - jsonPath: .metadata.ownerReferences[?(@.kind=="Machine")].name
      name: Machine
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: AlibabaCloudMachine is the Schema for the alibabacloudmachines
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlibabaCloudMachineSpec defines the desired state of AlibabaCloudMachine.
            properties:
              credentialsSecret:
                description: |-
                  CredentialsSecret refers to a Secret containing Alibaba Cloud credentials.
                  If not specified, the controller uses the ambient credentials from the
                  cluster credential infrastructure.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              dataDisks:
                description: DataDisks describes additional data disks.
                items:
                  description: DataDisk describes an additional data disk for an ECS
                    instance.
                  properties:
                    category:
                      description: Category is the disk category.
                      enum:
                      - cloud_efficiency
                      - cloud_ssd
                      - cloud_essd
                      - cloud_auto
                      type: string
                    encrypted:
                      description: Encrypted enables server-side encryption of the
                        disk.
                      type: boolean
                    kmsKeyID:
                      description: |-
                        KMSKeyID is the ID of the KMS key used to encrypt the disk. When Encrypted
                        is true and KMSKeyID is empty, Alibaba Cloud's default EBS service key is
                        used. Setting KMSKeyID without Encrypted=true is rejected by the webhook.
                      type: string
                    name:
                      description: Name is an optional identifier for the data disk.
                      type: string
                    performanceLevel:
                      description: |-
                        PerformanceLevel is the ESSD performance level. Only meaningful for the
                        cloud_essd category; ignored otherwise.
                      enum:
                      - PL0
                      - PL1
                      - PL2
                      - PL3
                      type: string
                    size:
                      description: Size is the disk size in GiB.
                      minimum: 20
                      type: integer
                  required:
                  - category
                  - size
                  type: object
                type: array
              imageID:
                description: |-
                  ImageID is the ID of the ECS image to use for the instance. When empty, the
                  owning AlibabaCloudCluster's spec.bootImageID is used instead (the cluster
                  RHCOS/discovery boot image). At least one of the two must be set, otherwise
                  provisioning fails with a terminal NoBootImage error.
                type: string
              instanceType:
                description: InstanceType is the ECS instance type (e.g. ecs.c6.large).
                type: string
              metadataOptions:
                description: |-
                  MetadataOptions configures the instance metadata service (IMDS). When
                  omitted, the controller applies a secure baseline: the metadata endpoint is
                  enabled and a session token is required (IMDSv2-equivalent,
                  httpTokens=required), which mitigates SSRF. Set explicitly to relax this.
                properties:
                  httpEndpoint:
                    description: |-
                      HttpEndpoint enables or disables the metadata endpoint. Defaults to
                      "enabled" when the whole MetadataOptions block is omitted.
                    enum:
                    - enabled
                    - disabled
                    type: string
                  httpPutResponseHopLimit:
                    description: |-
                      HttpPutResponseHopLimit is the maximum number of network hops the metadata
                      token may travel (1-64). 0 leaves the Alibaba Cloud API default.
                    maximum: 64
                    minimum: 0
                    type: integer
                  httpTokens:
                    description: |-
                      HttpTokens controls whether a session token is required to read metadata.
                      "required" enforces IMDSv2-style token auth (the secure default);
                      "optional" allows tokenless access.
                    enum:
                    - optional
                    - required
                    type: string
                type: object
              providerID:
                description: |-
                  ProviderID is the unique identifier as specified by the cloud provider.
                  Populated by the controller after ECS instance creation.
                type: string
              ramRoleName:
                description: RAMRoleName is the RAM role name to attach to the ECS
                  instance.
                type: string
              regionID:
                description: RegionID is the Alibaba Cloud region. Defaults to the
                  cluster region.
                type: string
              securityGroupIDs:
                description: SecurityGroupIDs is the list of security group IDs to
                  associate with the instance.
                items:
                  type: string
                type: array
              spotPriceLimit:
                description: |-
                  SpotPriceLimit is the maximum hourly price (in the region's currency) for a
                  spot instance. Required when SpotStrategy is SpotWithPriceLimit; ignored
                  otherwise.
                type: number
              spotStrategy:
                description: |-
                  SpotStrategy is the spot-instance bidding strategy:
                    - NoSpot (or empty): regular pay-as-you-go instance.
                    - SpotWithPriceLimit: spot instance with a user-set hourly price ceiling
                      (SpotPriceLimit is required).
                    - SpotAsPriceGo: spot instance priced at the current market rate.
                enum:
                - NoSpot
                - SpotWithPriceLimit
                - SpotAsPriceGo
                type: string
              systemDisk:
                description: SystemDisk describes the system disk configuration.
                properties:
                  category:
                    description: Category is the disk category (e.g. cloud_efficiency,
                      cloud_ssd, cloud_essd).
                    enum:
                    - cloud_efficiency
                    - cloud_ssd
                    - cloud_essd
                    - cloud_auto
                    type: string
                  encrypted:
                    description: Encrypted enables server-side encryption of the disk.
                    type: boolean
                  kmsKeyID:
                    description: |-
                      KMSKeyID is the ID of the KMS key used to encrypt the disk. When Encrypted
                      is true and KMSKeyID is empty, Alibaba Cloud's default EBS service key is
                      used. Setting KMSKeyID without Encrypted=true is rejected by the webhook.
                    type: string
                  performanceLevel:
                    description: |-
                      PerformanceLevel is the ESSD performance level. Only meaningful for the
                      cloud_essd category; ignored otherwise.
                    enum:
                    - PL0
                    - PL1
                    - PL2
                    - PL3
                    type: string
                  size:
                    description: Size is the disk size in GiB.
                    minimum: 20
                    type: integer
                required:
                - category
                - size
                type: object
              tags:
                description: Tags are additional tags to apply to the ECS instance.
                items:
                  description: Tag is a key-value pair applied to an Alibaba Cloud
                    resource.
                  properties:
                    key:
                      description: Key is the tag key.
                      minLength: 1
                      type: string
                    value:
                      description: Value is the tag value.
                      type: string
                  required:
                  - key
                  - value
                  type: object
                type: array
              userDataSecret:
                description: |-
                  UserDataSecret refers to a Secret containing the base64-encoded user data
                  script to execute on instance startup.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              vSwitchID:
                description: VSwitchID is the ID of the vSwitch to use for the primary
                  network interface.
                type: string
              zoneID:
                description: ZoneID is the availability zone within the region.
                type: string
            required:
            - instanceType
            type: object
          status:
            description: AlibabaCloudMachineStatus defines the observed state of AlibabaCloudMachine.
            properties:
              addresses:
                description: Addresses contains the associated addresses for the machine.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions defines current service state of the AlibabaCloudMachine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failureMessage:
                description: |-
                  FailureMessage will be set in the event that there is a terminal problem
                  reconciling the Machine and will contain a more verbose string suitable
                  for logging and human consumption.
                type: string
              failureReason:
                description: |-
                  FailureReason will be set in the event that there is a terminal problem
                  reconciling the Machine and will contain a succinct value suitable for
                  machine interpretation.
                type: string
              ignitionOSS:
                description: |-
                  IgnitionOSS records the OSS object holding this machine's offloaded
                  Ignition (set only when user-data exceeded the ECS limit and was offloaded),
                  so the controller can delete it when the machine is removed.
                properties:
                  bucket:
                    type: string
                  endpoint:
                    type: string
                  key:
                    type: string
                required:
                - bucket
                - key
                type: object
              instanceID:
                description: InstanceID is the ECS instance ID of the provisioned
                  machine.
                type: string
              instanceState:
                description: InstanceState reflects the current state of the ECS instance.
                type: string
              ready:
                default: false
                description: Ready indicates that the machine is ready to receive
                  workloads.
                type: boolean
            required:
            - ready
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
