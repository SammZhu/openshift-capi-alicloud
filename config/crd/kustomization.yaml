# The provider CRDs. bases/ is regenerated by `make generate` (controller-gen);
# do not hand-edit the bases.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bases/infrastructure.cluster.x-k8s.io_alibabacloudclusters.yaml
  - bases/infrastructure.cluster.x-k8s.io_alibabacloudmachines.yaml
  - bases/infrastructure.cluster.x-k8s.io_alibabacloudclustertemplates.yaml
  - bases/infrastructure.cluster.x-k8s.io_alibabacloudmachinetemplates.yaml
  - bases/controlplane.cluster.x-k8s.io_alibabacloudcontrolplanes.yaml
