# Defaulting (mutating) + validation (validating) webhooks for AlibabaCloudMachine
# and AlibabaCloudCluster (P3-CAPA.7 / task #29), served by the controller-manager
# on :9443. The service-ca inject-cabundle annotation makes service-ca fill each
# clientConfig.caBundle. failurePolicy: Fail is safe because the webhook runs in
# every (HA) replica and only intercepts infrastructure.cluster.x-k8s.io resources.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: capa-mutating-webhook-configuration
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: default.alibabacloudmachine.infrastructure.cluster.x-k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: capa-webhook-service
        namespace: capa-system
        path: /mutate-infrastructure-cluster-x-k8s-io-v1beta1-alibabacloudmachine
    rules:
      - apiGroups: ["infrastructure.cluster.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["alibabacloudmachines"]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: capa-validating-webhook-configuration
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: validation.alibabacloudmachine.infrastructure.cluster.x-k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: capa-webhook-service
        namespace: capa-system
        path: /validate-infrastructure-cluster-x-k8s-io-v1beta1-alibabacloudmachine
    rules:
      - apiGroups: ["infrastructure.cluster.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["alibabacloudmachines"]
        scope: Namespaced
  - name: validation.alibabacloudcluster.infrastructure.cluster.x-k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: capa-webhook-service
        namespace: capa-system
        path: /validate-infrastructure-cluster-x-k8s-io-v1beta1-alibabacloudcluster
    rules:
      - apiGroups: ["infrastructure.cluster.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["alibabacloudclusters"]
        scope: Namespaced
