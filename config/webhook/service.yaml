# Webhook serving Service. The service-ca annotation makes the OpenShift
# service-ca operator mint a serving cert into the capa-webhook-server-cert Secret
# that the controller Deployment mounts. (Under OLM, OLM provisions the cert from
# the CSV webhookdefinitions; the kind smoke self-signs it.)
apiVersion: v1
kind: Service
metadata:
  name: capa-webhook-service
  namespace: capa-system
  labels:
    app: capa-controller-manager
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: capa-webhook-server-cert
spec:
  selector:
    app: capa-controller-manager
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
