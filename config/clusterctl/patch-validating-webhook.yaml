# Replace service-ca caBundle injection with cert-manager's cainjector, which fills
# clientConfig.caBundle from the CA of capa-system/capa-serving-cert.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: capa-validating-webhook-configuration
  annotations:
    service.beta.openshift.io/inject-cabundle: null
    cert-manager.io/inject-ca-from: capa-system/capa-serving-cert
