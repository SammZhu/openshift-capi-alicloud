apiVersion: apps/v1
kind: Deployment
metadata:
  name: capa-controller-manager
  namespace: capa-system
  labels:
    app: capa-controller-manager
spec:
  # HA (P4-OPS.1): 2 replicas with leader election (--leader-elect=true below) —
  # only the leader reconciles, the standby takes over on leader loss. The webhook
  # server runs in EVERY replica (not leader-gated), so 2 replicas also keep
  # admission available during a node drain / rollout, which lets failurePolicy=Fail
  # stay safe (see config/webhook/).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: capa-controller-manager
  template:
    metadata:
      labels:
        app: capa-controller-manager
    spec:
      serviceAccountName: capa-controller-manager
      terminationGracePeriodSeconds: 10
      # Spread the replicas across nodes so a single node failure can't take both
      # the active leader and the standby (and both webhook servers) down at once.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: capa-controller-manager
      containers:
        - name: manager
          # Pinned to an immutable version TAG (NOT :latest) so IfNotPresent below
          # can't mask a rollout. This static value is the SSOT fallback; the
          # consumers override it:
          #   * ansible 08-deploy-post-install seds it to the mirror DIGEST
          #     (quay.io/...@sha256:...) so the install-config ImageDigestMirrorSet
          #     redirects the pull (a companion ImageTagMirrorSet covers tag pulls);
          #   * clusterctl gen-clusterctl-components.sh bakes CAPA_IMAGE.
          # Tag SSOT = ansible/vars/images.yml (capa_image) — keep in sync.
          image: quay.io/samzhu/openshift-capi-alicloud:v0.1.12
          imagePullPolicy: IfNotPresent
          command: [/manager]
          args:
            - --leader-elect=true
            - --concurrency=1
          # Inject Alibaba Cloud credentials from a Secret in the same namespace.
          # Required for CAPA's resolveCredential() (the aliyun Go SDK does NOT
          # auto-discover env vars — see commit bb1f73e). Create it once per
          # cluster before applying this manifest:
          #
          #   oc -n capa-system create secret generic alibaba-creds \
          #     --from-literal=ALIBABA_CLOUD_ACCESS_KEY_ID=$AK \
          #     --from-literal=ALIBABA_CLOUD_ACCESS_KEY_SECRET=$SK
          #
          # To harden via RAM RoleArn (AssumeRole) instead of a service-scoped
          # static key, add ALIBABA_CLOUD_ROLE_ARN (and optionally
          # ALIBABA_CLOUD_ROLE_SESSION_NAME) to this same Secret — the base key
          # then needs only sts:AssumeRole. See docs/RAM-POLICY.md.
          #
          # optional=false → Pod won't start until the Secret exists, making the
          # missing-credential mode a hard failure instead of a silent reconcile loop.
          envFrom:
            - secretRef:
                name: alibaba-creds
                optional: false
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9440
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9440
            initialDelaySeconds: 5
            periodSeconds: 10
          # Admission webhook server (defaulting + validation, P3-CAPA.7).
          # controller-runtime serves it on :9443 and reads its TLS cert from
          # /tmp/k8s-webhook-server/serving-certs (tls.crt/tls.key). On OpenShift the
          # cert is minted by the service-ca operator into the secret below (see
          # config/webhook/service.yaml annotation) — no cert-manager. Under OLM,
          # OLM injects it; the kind smoke self-signs it.
          ports:
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
            # Prometheus metrics (--metrics-bind-address :8080): controller-runtime
            # built-ins + the provider's capa_* metrics. Scraped via the metrics
            # Service + ServiceMonitor in config/metrics/.
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: capa-webhook-server-cert
            # Populated asynchronously by service-ca after the webhook Service is
            # created; optional=false would deadlock the very first apply, so allow
            # the pod to start and let the kubelet project the cert once it lands.
            optional: true
