name: CI

on:
  push:
    branches: ["main"]
    # Build + push a release image whenever a v* tag is pushed.
    # The tag name is used verbatim as the container tag (e.g. v0.1.2).
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go fmt
        run: |
          gofmt_files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$gofmt_files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$gofmt_files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test
        run: go test -v -count=1 -timeout=120s ./...

      - name: govulncheck (Go vulnerability scan)
        # Fails on vulnerabilities reachable from this module's code, including the
        # Go standard library (build toolchain). Go-native — catches what Trivy on
        # the final image would miss (source-level reachability).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  cross-compile:
    name: Cross-compile Linux amd64 binary
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go
          echo "Binary size: $(du -sh bin/manager-linux-amd64 | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-linux-amd64
          path: bin/manager-linux-amd64
          retention-days: 7

  container-build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: cross-compile
    # Push to registry on:
    #   - main branch commit  → tagged as the short SHA + :latest
    #   - v* tag push         → tagged as the tag name (e.g. :v0.1.2)
    # PRs only verify the image builds (no push).
    # Set REGISTRY_USER / REGISTRY_PASSWORD secrets in repo settings to enable push.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary for container
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-extldflags '-static'" \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go

      - name: Set image tag
        id: tag
        run: |
          # Tag push  → use the tag name verbatim (e.g. v0.1.2)
          # Branch push → use the short SHA
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=quay.io/samzhu/openshift-capi-alicloud:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            -t ${{ steps.tag.outputs.image }} \
            -t quay.io/samzhu/openshift-capi-alicloud:latest \
            -f Dockerfile \
            .

      # GitHub Actions does NOT allow `secrets` in step-level `if`. Push the
      # check down into bash so the step always runs and silently no-ops when
      # the registry credentials are not configured (forks, etc).
      - name: Push container image
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USER" ]; then
            echo "REGISTRY_USER secret not configured — skipping push."
            exit 0
          fi
          echo "$REGISTRY_PASSWORD" | docker login quay.io -u "$REGISTRY_USER" --password-stdin
          docker push ${{ steps.tag.outputs.image }}
          docker push quay.io/samzhu/openshift-capi-alicloud:latest

  sync-deploy-tag:
    name: Sync image tag to alibaba-openshift
    runs-on: ubuntu-latest
    needs: container-build
    # Only on a v* release tag (not main SHA builds). After the image is pushed,
    # bump capa_image_tag in the deploy repo's SSOT (ansible/vars/images.yml) and
    # commit it, so a plain `git pull` over there picks up the new version.
    # Requires repo secret ANSIBLE_REPO_TOKEN = a PAT (or fine-grained token) with
    # contents:write on SammZhu/alibaba-openshift. Without it, this job no-ops.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check sync token configured
        id: guard
        env:
          ANSIBLE_REPO_TOKEN: ${{ secrets.ANSIBLE_REPO_TOKEN }}
        run: |
          if [ -z "$ANSIBLE_REPO_TOKEN" ]; then
            echo "ANSIBLE_REPO_TOKEN not set — skipping deploy-repo sync (configure it to enable)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout alibaba-openshift
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: SammZhu/alibaba-openshift
          ref: main
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}

      - name: Bump capa_image_tag and push
        if: steps.guard.outputs.ok == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file=ansible/vars/images.yml
          sed -i -E "s|^capa_image_tag:.*|capa_image_tag: \"${TAG}\"|" "$file"
          grep -E '^capa_image_tag:' "$file"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "capa_image_tag already ${TAG} — nothing to commit."
            exit 0
          fi
          git add "$file"
          git commit -m "chore(images): bump capa_image_tag to ${TAG} (auto from provider CI)"
          git push origin main

  release:
    name: Publish clusterctl release artifacts
    runs-on: ubuntu-latest
    needs: container-build
    # On a v* tag, generate the clusterctl artifacts (infrastructure-components +
    # metadata + cluster-template) from the config/ kustomize SSOT, baking the just-
    # pushed image, and publish them as GitHub Release assets. This is how clusterctl
    # (and the upstream provider list) discover the provider: the release URL serves
    # these three files. Idempotent — re-running updates the release's assets.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Ensure PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Generate clusterctl release artifacts
        env:
          CAPA_IMAGE: quay.io/samzhu/openshift-capi-alicloud:${{ github.ref_name }}
          # cert-manager webhook certs (vanilla-k8s), not OpenShift service-ca.
          CAPA_KUSTOMIZE_DIR: ${{ github.workspace }}/config/clusterctl
        run: |
          hack/gen-clusterctl-components.sh out/infrastructure-components.yaml
          cp metadata.yaml out/metadata.yaml
          cp templates/cluster-template.yaml out/cluster-template.yaml
          ls -l out/

      - name: Publish GitHub Release with clusterctl assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/infrastructure-components.yaml
            out/metadata.yaml
            out/cluster-template.yaml
          fail_on_unmatched_files: true
