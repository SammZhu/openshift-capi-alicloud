name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go fmt
        run: |
          gofmt_files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$gofmt_files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$gofmt_files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test
        run: go test -v -count=1 -timeout=120s ./...

  cross-compile:
    name: Cross-compile Linux amd64 binary
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go
          echo "Binary size: $(du -sh bin/manager-linux-amd64 | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-linux-amd64
          path: bin/manager-linux-amd64
          retention-days: 7
