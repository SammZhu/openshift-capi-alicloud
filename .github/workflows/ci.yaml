name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go fmt
        run: |
          gofmt_files=$(gofmt -l $(find . -name '*.go' | grep -v vendor))
          if [ -n "$gofmt_files" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$gofmt_files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test
        run: go test -v -count=1 -timeout=120s ./...

  cross-compile:
    name: Cross-compile Linux amd64 binary
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go
          echo "Binary size: $(du -sh bin/manager-linux-amd64 | cut -f1)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-linux-amd64
          path: bin/manager-linux-amd64
          retention-days: 7

  container-build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: cross-compile
    # Only push to registry on main branch; PRs just verify the image builds.
    # Set REGISTRY_USER / REGISTRY_PASSWORD secrets in repo settings to enable push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary for container
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-extldflags '-static'" \
            -o bin/manager-linux-amd64 \
            ./cmd/main.go

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=quay.io/samzhu/openshift-capi-alicloud:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: |
          docker build \
            -t ${{ steps.tag.outputs.image }} \
            -t quay.io/samzhu/openshift-capi-alicloud:latest \
            -f Dockerfile \
            .

      - name: Push container image
        if: ${{ secrets.REGISTRY_USER != '' }}
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login quay.io -u "$REGISTRY_USER" --password-stdin
          docker push ${{ steps.tag.outputs.image }}
          docker push quay.io/samzhu/openshift-capi-alicloud:latest
